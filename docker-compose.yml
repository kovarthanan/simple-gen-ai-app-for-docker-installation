services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # container hostnames override the localhost values in .env
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag_hitl
      UPLOAD_DIR: /data/raw
      HF_HOME: /models
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
      - hf_cache:/models   # embedding model is downloaded once
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started   # backend creates the graph schema on first write if Neo4j is still booting
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_hitl
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_hitl"]
      interval: 5s
      retries: 20

volumes:
  qdrant_data:
  neo4j_data:
  pg_data:
  hf_cache:
